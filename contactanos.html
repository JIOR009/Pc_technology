    <style>
        /* Estilos Generales */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; /* Fuente moderna y limpia */
            margin: 0;
            background-color: #f4f4f9; /* Un fondo gris muy suave */
            color: #333;
        }

        /* Estilos del Encabezado (Header) */
        header {
            background-color: #ffffff; /* Fondo blanco puro para limpieza */
            color: #333;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between; /* Separa logo y menú */
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05); /* Sombra suave para dar profundidad */
            position: sticky; /* Se mantiene arriba al hacer scroll */
            top: 0;
            z-index: 1000;
        }

        /* Estilos del Logo */
        .logo-container {
            display: flex;
            align-items: center;
            text-decoration: none; /* Quita subrayado si es un enlace */
            color: inherit;
        }

        .logo-icon {
            font-size: 2rem;
            font-weight: bold;
            color: #007bff; /* Color azul tecnológico accent */
            margin-right: 10px;
        }

        .logo-text {
            display: flex;
            flex-direction: column;
        }

        .company-name {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .slogan {
            font-size: 0.8rem;
            color: #777;
            margin-top: -2px;
        }

        /* Estilos del Menú de Navegación */
        nav ul {
            list-style: none;
            margin: 0;
            padding: 0;
            display: flex;
            gap: 1.5rem; /* Espaciado entre items */
        }

        nav a {
            text-decoration: none;
            color: #555;
            font-weight: 500;
            font-size: 1rem;
            transition: color 0.3s ease; /* Transición suave para el hover */
            padding: 0.5rem 0;
            position: relative;
        }

        /* Efecto Hover con línea inferior */
        nav a::after {
            content: '';
            position: absolute;
            width: 0;
            height: 2px;
            bottom: 0;
            left: 0;
            background-color: #007bff;
            transition: width 0.3s ease;
        }

        nav a:hover {
            color: #007bff;
        }

        nav a:hover::after {
            width: 100%;
        }

        /* Estilos del Botón de Acción (Call to Action) */
        .cta-button {
            background-color: #007bff;
            color: white;
            padding: 0.6rem 1.2rem;
            border-radius: 5px;
            text-decoration: none;
            font-weight: 600;
            transition: background-color 0.3s ease;
        }

        .cta-button:hover {
            background-color: #0056b3;
        }

        /* Responsividad básica para móviles */
        @media (max-width: 768px) {
            header {
                flex-direction: column;
                padding: 1rem;
            }

            nav ul {
                flex-direction: column;
                align-items: center;
                gap: 1rem;
                margin-top: 1rem;
            }

            .cta-button {
                margin-top: 1rem;
            }
        }
    </style>
